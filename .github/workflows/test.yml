# Based on https://github.com/edwardspec/mediawiki-aws-s3/blob/master/.github/workflows/main.yml
name: Test

on: [push, pull_request, workflow_dispatch]

env:
  DBTYPE: mysql
  DBUSER: root

jobs:
  # PHP linters: phpcs, parallel-lint, etc.
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache
      - run: composer install --no-interaction
      - run: composer test

  # PHPUnit against the deployed and upcoming LTS branches.
  phpunit:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        mw-branch: [REL1_43, REL1_47]
        include:
          - php: '8.1'
            mw-branch: REL1_43
          - php: '8.2'
            mw-branch: REL1_43
    env:
      branch: ${{ matrix.mw-branch }}
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:latest
        ports:
          - 11211:11211
        options: --health-cmd "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/11211'" --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 1
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Setup cache
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ env.branch }}-${{ hashFiles('composer.json') }}

      # Setup PHP
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, opcache, mysqli
          tools: composer

      # Setup MediaWiki
      - name: (debug) Print "php -i"
        run: php -i
      - uses: edwardspec/github-action-build-mediawiki@v1
        with:
          branch: ${{ env.branch }}
          extraLocalSettings: tests/ci/SentrySettings.php
      - name: Finalize the installation of MediaWiki
        run: |
          rsync -a --exclude buildcache --exclude mediawiki --exclude .git . mediawiki/extensions/Sentry/
          cd mediawiki
          cp extensions/Sentry/tests/ci/composer.local.json . && composer update
          echo '{{CURRENTVERSION}}' | php maintenance/parse.php

      # RUN -- phpunit
      - name: RUN -- phpunit
        run: |
          cd mediawiki
          composer phpunit:entrypoint -- extensions/Sentry/tests/phpunit/
